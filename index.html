<script>
const API = 'https://sayad-voice-api.parsaparssss649.workers.dev';

const $ = id => document.getElementById(id);

const fa = n =>
  String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

const fmt = s => {
  s = Math.max(0, Math.floor(Number(s) || 0));
  const m = Math.floor(s / 60);
  const x = s % 60;
  return `${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`;
};

const esc = s =>
  String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));

let audios = [];
let progress = {};
let current = null;

/* =========================
   PAGE NAVIGATION
========================= */

function showStudentPage() {
  $('homeHero').classList.add('page-hidden');
  $('studentLoginSection').classList.add('page-hidden');
  $('studentPanel').classList.remove('hidden');
  $('studentPanel').classList.add('fade-in');
  $('teacherPanel').classList.add('page-hidden');

  history.replaceState(null, '', '#student');
}

function showHomePage() {
  $('homeHero').classList.remove('page-hidden');
  $('studentLoginSection').classList.remove('page-hidden');
  $('studentPanel').classList.add('hidden');
  $('teacherPanel').classList.add('page-hidden');

  history.replaceState(null, '', '#home');
}

function showTeacherPage() {
  $('homeHero').classList.add('page-hidden');
  $('studentLoginSection').classList.add('page-hidden');
  $('studentPanel').classList.add('hidden');

  $('teacherPanel').classList.remove('page-hidden');
  $('teacherPanel').classList.add('fade-in');

  history.replaceState(null, '', '#teacher');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function modal(id, show) {
  $(id).classList.toggle('hidden', !show);
}

/* =========================
   API
========================= */

async function api(path, opt = {}) {
  const h = new Headers(opt.headers || {});

  if (opt.body && !(opt.body instanceof FormData)) {
    h.set('Content-Type', 'application/json');
  }

  const r = await fetch(API + path, {
    ...opt,
    headers: h
  });

  const t = await r.text();

  let d = {};

  try {
    d = t ? JSON.parse(t) : {};
  } catch {
    d = {
      error: t
    };
  }

  if (!r.ok) {
    throw new Error(
      d.error ||
      d.message ||
      ('HTTP ' + r.status)
    );
  }

  return d;
}

/* =========================
   CLIENT ID
========================= */

function client() {
  let x = localStorage.getItem('sayad_client_id');

  if (!x) {
    x =
      (crypto.randomUUID
        ? crypto.randomUUID()
        : 'c_' +
          Date.now() +
          '_' +
          Math.random().toString(36).slice(2));

    localStorage.setItem('sayad_client_id', x);
  }

  return x;
}

/* =========================
   STUDENT LOGIN
========================= */

async function loginStudent() {
  const name = $('name').value.trim();
  const klass = $('klass').value.trim();

  if (!name || !klass) {
    $('savedNote').textContent =
      'نام و شماره کلاس را کامل وارد کن.';
    return;
  }

  localStorage.setItem('sayad_name', name);
  localStorage.setItem('sayad_class', klass);
  localStorage.setItem('sayad_logged_in', '1');

  $('helloName').textContent = name;
  $('helloClass').textContent = fa(klass);

  $('savedNote').textContent = 'ذخیره شد ✓';

  /*
    اطلاعات دانش‌آموز را به Worker می‌فرستیم.
    اگر Worker خطا بدهد، ورود محلی همچنان انجام می‌شود.
  */
  try {
    await api('/api/student', {
      method: 'POST',
      body: JSON.stringify({
        name: name,
        client_id: client(),
        class: klass
      })
    });
  } catch (e) {
    console.log('Student registration warning:', e);
  }

  showStudentPage();

  await load();
}

/* =========================
   LOAD AUDIO
========================= */

async function load() {
  try {
    const a = await api('/api/audios');

    audios = a.audios || [];

    const p = await api(
      '/api/progress?client_id=' +
      encodeURIComponent(client())
    );

    progress = {};

    for (const x of (p.progress || [])) {
      progress[x.audio_id] = x;
    }

    render();

  } catch (e) {

    console.error('Audio load error:', e);

    $('audioList').innerHTML =
      '<div class="empty">ارتباط با سرور برقرار نشد.</div>';
  }
}

/* =========================
   RENDER AUDIO LIST
========================= */

function render() {
  if (!audios.length) {
    $('audioList').innerHTML =
      '<div class="empty">هنوز فایل صوتی منتشر نشده است 🎧</div>';
    return;
  }

  $('audioList').innerHTML = audios.map(a => {

    const p = progress[a.id];

    const pc = Math.max(
      0,
      Math.min(
        100,
        Number(p?.percent || 0)
      )
    );

    return `
      <div class="audio-item">

        <div class="audio-icon">
          ♫
        </div>

        <div>

          <div class="audio-title">
            ${esc(a.title)}
          </div>

          <div class="audio-meta">
            ${esc(a.filename || 'فایل صوتی')}
            ·
            ${fa(pc.toFixed(0))}٪ گوش داده شده
          </div>

          <div class="mini-progress">
            <span style="width:${pc}%"></span>
          </div>

        </div>

        <button
          class="play"
          data-id="${a.id}"
        >
          ▶
        </button>

      </div>
    `;

  }).join('');

  document
    .querySelectorAll('[data-id]')
    .forEach(b => {
      b.onclick = () => play(
        Number(b.dataset.id)
      );
    });
}

/* =========================
   PLAY AUDIO
========================= */

async function play(id) {

  const a = audios.find(
    x => x.id === id
  );

  if (!a) return;

  current = id;

  $('nowTitle').textContent =
    a.title;

  $('nowMeta').textContent =
    a.filename || 'فایل صوتی';

  const p = progress[id];

  const el = $('audio');

  el.src =
    API +
    '/api/audio?id=' +
    encodeURIComponent(id);

  el.onloadedmetadata = () => {

    if (
      p?.position &&
      p.position < el.duration - 2
    ) {
      el.currentTime = p.position;
    }

    el.play()
      .then(() => {
        $('play').textContent = '❚❚';
      })
      .catch(() => {});

  };

  el.load();
}

/* =========================
   SAVE PROGRESS
========================= */

async function saveProgress() {

  const el = $('audio');

  if (
    !current ||
    !Number.isFinite(el.duration)
  ) {
    return;
  }

  try {

    const x = await api(
      '/api/progress',
      {
        method: 'POST',

        body: JSON.stringify({
          client_id: client(),
          audio_id: current,
          position: el.currentTime,
          duration: el.duration
        })
      }
    );

    progress[current] = {
      audio_id: current,
      position: el.currentTime,
      duration: el.duration,
      percent: x.percent
    };

    render();

  } catch (e) {
    console.log(
      'Progress save warning:',
      e
    );
  }
}

/* =========================
   TEACHER LOAD
========================= */

async function loadTeacher() {

  const code =
    sessionStorage.getItem(
      'sayad_teacher'
    );

  if (!code) {
    return false;
  }

  /*
    اول تلاش می‌کنیم آمار را بگیریم.
  */

  try {

    const x = await api(
      '/api/teacher/stats',
      {
        headers: {
          'X-Teacher-Code': code
        }
      }
    );

    if (!x.ok) {
      throw new Error(
        'TEACHER_AUTH_FAILED'
      );
    }

    const stats =
      x.stats || [];

    const students =
      x.students || [];

    const details =
      x.details || [];

    $('tStudents').textContent =
      fa(students.length);

    $('tAudios').textContent =
      fa(stats.length);

    $('tProgress').textContent =
      fa(details.length);

    const avg =
      stats.length
        ? stats.reduce(
            (s, a) =>
              s +
              Number(
                a.average_percent || 0
              ),
            0
          ) / stats.length
        : 0;

    $('tAverage').textContent =
      fa(avg.toFixed(0)) + '٪';

    $('teacherMessage').textContent =
      'آمار با موفقیت دریافت شد ✓';

    /*
      حتی بعد از دریافت آمار،
      پنل را حتماً نمایش بده.
    */
    showTeacherPage();

    return true;

  } catch (e) {

    console.log(
      'Teacher statistics error:',
      e
    );

    /*
      اگر قبلاً وارد شده بود ولی
      آمار مشکل داشت، پنل را مخفی نکن.
    */

    $('tStudents').textContent = '—';
    $('tAudios').textContent = '—';
    $('tProgress').textContent = '—';
    $('tAverage').textContent = '—';

    $('teacherMessage').textContent =
      'پنل باز شد، اما دریافت آمار از سرور انجام نشد.';

    showTeacherPage();

    return true;
  }
}

/* =========================
   STUDENT BUTTON
========================= */

$('studentBtn').onclick = () => {

  if (
    localStorage.getItem(
      'sayad_logged_in'
    ) === '1' &&
    localStorage.getItem(
      'sayad_name'
    )
  ) {

    showStudentPage();

    load();

    return;
  }

  document
    .querySelector('.student-card')
    .scrollIntoView({
      behavior: 'smooth'
    });
};

/* =========================
   ABOUT
========================= */

$('aboutBtn').onclick = () => {
  modal('about', true);
};

/* =========================
   TEACHER BUTTON
========================= */

$('teacherBtn').onclick = async () => {

  /*
    اگر قبلاً کد معلم روی این دستگاه
    ذخیره شده، مستقیم پنل را باز کن.
  */

  const savedTeacher =
    sessionStorage.getItem(
      'sayad_teacher'
    );

  if (savedTeacher) {

    showTeacherPage();

    await loadTeacher();

    return;
  }

  modal(
    'teacher',
    true
  );

  setTimeout(() => {
    $('teacherCode').focus();
  }, 100);
};

/* =========================
   CLOSE MODALS
========================= */

document
  .querySelectorAll('[data-close]')
  .forEach(x => {

    x.onclick = () => {

      modal(
        x.dataset.close,
        false
      );

    };

  });

/* =========================
   TEACHER LOGIN
========================= */

$('teacherLogin').onclick = async () => {

  const code =
    $('teacherCode').value.trim();

  $('teacherError').textContent = '';

  if (!code) {

    $('teacherError').textContent =
      'کد مدیریت را وارد کن.';

    return;
  }

  /*
    کد روی Session ذخیره می‌شود.
  */
  sessionStorage.setItem(
    'sayad_teacher',
    code
  );

  /*
    اینجا مهم‌ترین تغییر:
    پنل معلم را قبل از درخواست آمار باز می‌کنیم.
  */

  modal(
    'teacher',
    false
  );

  $('teacherCode').value = '';

  showTeacherPage();

  $('teacherMessage').textContent =
    'در حال دریافت اطلاعات...';

  /*
    حالا آمار را می‌گیریم.
    حتی اگر این درخواست خراب شود،
    پنل بسته نمی‌شود.
  */

  try {

    const x = await api(
      '/api/teacher/stats',
      {
        headers: {
          'X-Teacher-Code': code
        }
      }
    );

    if (!x.ok) {
      throw new Error(
        'INVALID_TEACHER_CODE'
      );
    }

    const stats =
      x.stats || [];

    const students =
      x.students || [];

    const details =
      x.details || [];

    $('tStudents').textContent =
      fa(students.length);

    $('tAudios').textContent =
      fa(stats.length);

    $('tProgress').textContent =
      fa(details.length);

    const avg =
      stats.length
        ? stats.reduce(
            (s, a) =>
              s +
              Number(
                a.average_percent || 0
              ),
            0
          ) / stats.length
        : 0;

    $('tAverage').textContent =
      fa(avg.toFixed(0)) + '٪';

    $('teacherMessage').textContent =
      'ورود موفق بود و آمار دریافت شد ✓';

  } catch (e) {

    console.error(
      'Teacher login error:',
      e
    );

    /*
      پنل را باز نگه می‌داریم.
    */

    $('tStudents').textContent = '—';
    $('tAudios').textContent = '—';
    $('tProgress').textContent = '—';
    $('tAverage').textContent = '—';

    $('teacherMessage').textContent =
      'پنل باز شد، اما سرور آمار را برنگرداند.';
  }
};

/* =========================
   STUDENT REFRESH
========================= */

$('refresh').onclick = async () => {

  $('audioList').innerHTML =
    '<div class="empty">در حال بروزرسانی...</div>';

  await load();
};

/* =========================
   PLAYER
========================= */

$('play').onclick = () => {

  const el = $('audio');

  if (!current) {
    return;
  }

  if (el.paused) {

    el.play()
      .then(() => {
        $('play').textContent =
          '❚❚';
      })
      .catch(() => {});

  } else {

    el.pause();

    $('play').textContent =
      '▶';
  }
};

$('back').onclick = () => {

  const el = $('audio');

  el.currentTime =
    Math.max(
      0,
      el.currentTime - 10
    );

  saveProgress();
};

$('forward').onclick = () => {

  const el = $('audio');

  el.currentTime =
    Math.min(
      el.duration || 0,
      el.currentTime + 10
    );

  saveProgress();
};

$('audio').addEventListener(
  'play',
  () => {
    $('play').textContent =
      '❚❚';
  }
);

$('audio').addEventListener(
  'pause',
  () => {
    $('play').textContent =
      '▶';
  }
);

$('audio').addEventListener(
  'timeupdate',
  () => {

    const el =
      $('audio');

    $('cur').textContent =
      fmt(el.currentTime);

    $('dur').textContent =
      fmt(el.duration);

    $('seek').value =
      el.duration
        ? (
            el.currentTime /
            el.duration
          ) * 100
        : 0;

    /*
      هر 5 ثانیه پیشرفت ذخیره می‌شود.
    */

    if (
      Math.floor(
        el.currentTime
      ) % 5 === 0
    ) {
      saveProgress();
    }
  }
);

$('seek').oninput = () => {

  const el =
    $('audio');

  el.currentTime =
    (
      Number(
        $('seek').value
      ) / 100
    ) *
    (el.duration || 0);

};

/* =========================
   STUDENT LOGOUT
========================= */

$('logoutStudent').onclick = () => {

  $('audio').pause();

  $('audio').removeAttribute(
    'src'
  );

  localStorage.removeItem(
    'sayad_name'
  );

  localStorage.removeItem(
    'sayad_class'
  );

  localStorage.removeItem(
    'sayad_logged_in'
  );

  localStorage.removeItem(
    'sayad_client_id'
  );

  $('name').value = '';

  $('klass').value = '802';

  showHomePage();
};

/* =========================
   TEACHER REFRESH
========================= */

$('refreshTeacher').onclick =
  async () => {

    const code =
      sessionStorage.getItem(
        'sayad_teacher'
      );

    if (!code) {

      showHomePage();

      return;
    }

    $('teacherMessage').textContent =
      'در حال بروزرسانی آمار...';

    try {

      const x = await api(
        '/api/teacher/stats',
        {
          headers: {
            'X-Teacher-Code':
              code
          }
        }
      );

      if (!x.ok) {
        throw new Error();
      }

      const stats =
        x.stats || [];

      const students =
        x.students || [];

      const details =
        x.details || [];

      $('tStudents').textContent =
        fa(students.length);

      $('tAudios').textContent =
        fa(stats.length);

      $('tProgress').textContent =
        fa(details.length);

      const avg =
        stats.length
          ? stats.reduce(
              (s, a) =>
                s +
                Number(
                  a.average_percent ||
                  0
                ),
              0
            ) / stats.length
          : 0;

      $('tAverage').textContent =
        fa(avg.toFixed(0)) +
        '٪';

      $('teacherMessage').textContent =
        'آمار بروزرسانی شد ✓';

    } catch (e) {

      console.error(
        'Teacher refresh error:',
        e
      );

      $('teacherMessage').textContent =
        'پنل فعال است، ولی دریافت آمار انجام نشد.';
    }
  };

/* =========================
   TEACHER LOGOUT
========================= */

$('logoutTeacher').onclick = () => {

  sessionStorage.removeItem(
    'sayad_teacher'
  );

  showHomePage();
};

/* =========================
   STARTUP
========================= */

(async function startup() {

  const n =
    localStorage.getItem(
      'sayad_name'
    );

  const c =
    localStorage.getItem(
      'sayad_class'
    );

  if (n) {
    $('name').value = n;
  }

  if (c) {
    $('klass').value = c;
  }

  /*
    اگر معلم قبلاً وارد شده،
    مستقیم پنل معلم را باز کن.
  */

  const teacher =
    sessionStorage.getItem(
      'sayad_teacher'
    );

  if (teacher) {

    showTeacherPage();

    await loadTeacher();

    return;
  }

  /*
    اگر دانش‌آموز قبلاً وارد شده،
    مستقیم داشبورد دانش‌آموز را باز کن.
  */

  if (
    localStorage.getItem(
      'sayad_logged_in'
    ) === '1' &&
    n &&
    c
  ) {

    $('helloName').textContent =
      n;

    $('helloClass').textContent =
      fa(c);

    showStudentPage();

    await load();

    return;
  }

  /*
    اگر با #student آمده،
    صفحه دانش‌آموز را نشان بده.
  */

  if (
    location.hash === '#student'
  ) {

    showStudentPage();

    return;
  }

  /*
    حالت پیش‌فرض
  */

  showHomePage();

})();
</script>
